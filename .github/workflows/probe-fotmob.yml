# Tek soruyu ölçen geçici deney: GitHub runner'ından FotMob'a erişilebiliyor mu?
#
# 5.2 (günlük veri işi) yalnız girişe ihtiyaç duymayan kaynakları
# otomatikleştirebilir; onların hepsi FotMob. Ama Cloudflare'in veri merkezi
# IP'lerini engellemesi yaygın ve engelliyse günlük işi yazmak boşa emek olur.
# Bu yüzden önce ölçüyoruz: elle tetiklenir, hiçbir şey yazmaz.
#
# Sonuç PLAN.md §5.2'ye kaydedildikten sonra bu dosya silinir.

name: FotMob erişim ölçümü

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      # 1. Düz HTTP: Cloudflare doğrudan engelliyorsa burada görünür.
      - name: HTTP durumu
        run: |
          echo "kok:  $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' https://www.fotmob.com/)"
          echo "takim: $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' https://www.fotmob.com/teams/8637/fixtures/galatasaray)"

      # 2. Asıl yöntem: betiklerin kullandığı headless Chrome DOM dökümü.
      #    Veri sayfanın içindeki __NEXT_DATA__ JSON'unda; o yoksa sayfa
      #    gelmiş ama işe yaramaz demektir (challenge sayfası).
      - name: Headless Chrome DOM
        run: |
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=20000 \
            --dump-dom "https://www.fotmob.com/teams/8637/fixtures/galatasaray" > dom.html 2> chrome.log || true
          echo "DOM boyutu: $(wc -c < dom.html) bayt"
          echo "__NEXT_DATA__ sayisi: $(grep -c '__NEXT_DATA__' dom.html || true)"
          echo "challenge izi: $(grep -ci 'just a moment\|cf-challenge\|checking your browser' dom.html || true)"
          head -c 300 dom.html
